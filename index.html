<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Quick Electron</title>
  </head>
  <body>
    <h1>Hello, Electron!</h1>
    <div id="myDiv"></div>
    <script>
      window.electronAPI.onSetValue((event, value) => {
        document.getElementById('myDiv').innerText = value;
      });
    </script>
  </body>
</html>
